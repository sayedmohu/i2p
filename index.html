<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPEG to PDF Size-Optimized Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; }
        .file-input-wrapper input[type=file] { position: absolute; left: -9999px; }
        .file-input-label { display: block; padding: 1rem 2rem; border: 2px dashed #ccc; border-radius: 8px; background: #f9f9f9; cursor: pointer; text-align: center; transition: all 0.2s; }
        .file-input-label:hover { border-color: #007bff; background: #f0f8ff; }
        .controls { margin: 1rem 0; display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
        .control-group { display: flex; flex-direction: column; }
        input[type="number"], input[type="text"] { width: 140px; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; }
        label { font-weight: 500; margin-bottom: 0.25rem; }
        button { background: #007bff; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-size: 1rem; white-space: nowrap; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { margin: 1rem 0; padding: 1rem; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .warn { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .progress { width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 1rem 0; }
        .progress-bar { height: 100%; background: #007bff; width: 0%; transition: none; }
        #fileList { margin-top: 1rem; }
        .file-item { padding: 0.5rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .download-link { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem; background: #28a745; color: white; text-decoration: none; border-radius: 4px; }
        .progress-text { font-size: 0.9rem; margin-top: 0.25rem; text-align: center; }
        @media (max-width: 500px) { .controls { flex-direction: column; align-items: stretch; } input[type="number"], input[type="text"] { width: 100%; } }
    </style>
</head>
<body>
    <h1>JPEG to PDF Size-Optimized</h1>
    <p>Upload JPEG images and set max PDF size. It automatically optimizes to meet your limit (goes aggressive if needed).</p>
    
    <div class="file-input-wrapper">
        <input type="file" id="imageInput" multiple accept="image/jpeg,image/jpg">
        <label for="imageInput" class="file-input-label">📁 Select JPEG images</label>
    </div>
    
    <div id="fileList"></div>
    
    <div class="controls">
        <div class="control-group">
            <label>Output filename:</label>
            <input type="text" id="outputName" placeholder="My Report" maxlength="50">
        </div>
        <div class="control-group">
            <label>Max PDF size:</label>
            <input type="number" id="maxSize" min="1" max="51200" step="50" value="350"> KB
        </div>
        <button id="generateBtn" disabled>Generate PDF</button>
    </div>
    
    <div id="status" class="status info" style="display: none;"></div>
    <div id="progressContainer" style="display: none;">
        <div id="progress" class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="progressText" class="progress-text"></div>
    </div>
    <a id="downloadLink" class="download-link" style="display: none;">📥 Download PDF</a>

    <script>
        const { jsPDF } = window.jspdf;
        const imageInput = document.getElementById('imageInput');
        const fileList = document.getElementById('fileList');
        const outputNameInput = document.getElementById('outputName');
        const maxSizeInput = document.getElementById('maxSize');
        const generateBtn = document.getElementById('generateBtn');
        const status = document.getElementById('status');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const downloadLink = document.getElementById('downloadLink');
        
        let selectedImages = [];
        let currentProgressTarget = 0;
        
        imageInput.addEventListener('change', (e) => {
            selectedImages = Array.from(e.target.files).filter(f => f.type.startsWith('image/jpeg'));
            updateFileList();
            generateBtn.disabled = selectedImages.length === 0;
        });
        
        function sanitizeFilename(name) {
            return name
                .trim()
                .replace(/\s+/g, '_')
                .replace(/[^a-zA-Z0-9_-]/g, '')
                .substring(0, 40)
                || 'output';
        }
        
        function getTimestamp() {
            const now = new Date();
            const HHMM = now.toTimeString().slice(0, 5);  // "23:12"
            const DDMMYYYY = now.toLocaleDateString('en-GB').replace(/\//g, '-');  // "18-02-2026"
            return `${HHMM}_${DDMMYYYY}`;
            // Format: 23:12_18-02-2026 ✅ Hour:minute separator
        }
        
        function updateFileList() {
            fileList.innerHTML = selectedImages.map(f => `<div class="file-item">${f.name} (${(f.size/1024).toFixed(0)} KB)</div>`).join('') || '<div>No JPEGs selected</div>';
        }
        
        function updateProgress(targetPercent, text = '') {
            currentProgressTarget = targetPercent;
            const animate = () => {
                const diff = targetPercent - currentProgressTarget;
                currentProgressTarget += diff * 0.3;
                
                const clamped = Math.min(100, Math.max(0, currentProgressTarget));
                progressBar.style.width = clamped + '%';
                if (text) progressText.textContent = text;
                
                if (Math.abs(targetPercent - currentProgressTarget) > 0.1) {
                    requestAnimationFrame(animate);
                } else if (targetPercent === 100) {
                    progressBar.style.width = '100%';
                }
            };
            requestAnimationFrame(animate);
        }
        
        generateBtn.addEventListener('click', async () => {
            const maxBytes = parseInt(maxSizeInput.value) * 1024;
            if (maxBytes < 1024) {
                showStatus('warn', 'Max size too small (minimum 1KB)');
                return;
            }
            
            showStatus('info', 'Loading images...');
            progressContainer.style.display = 'block';
            generateBtn.disabled = true;
            currentProgressTarget = 0;
            
            updateProgress(5, 'Loading images...');
            const images = await Promise.all(selectedImages.map(fileToImage));
            updateProgress(15, `${images.length} images loaded`);
            
            const strategies = [
                { name: 'High Quality', scale: 1.0, minQuality: 0.7, step: 0.05 },
                { name: 'Medium', scale: 0.8, minQuality: 0.5, step: 0.05 },
                { name: 'Aggressive', scale: 0.6, minQuality: 0.3, step: 0.03 },
                { name: 'Extreme', scale: 0.4, minQuality: 0.2, step: 0.02 }
            ];
            
            let pdfBlob = null;
            let finalStrategy = '';
            
            strategyLoop: for (let s = 0; s < strategies.length; s++) {
                const strat = strategies[s];
                const baseProgress = 20 + (s * 18);
                
                showStatus('info', `Trying ${strat.name}...`);
                updateProgress(baseProgress, `${strat.name} (${Math.round(strat.scale*100)}% scale)`);
                
                let quality = 0.95;
                let attempts = 0;
                const maxAttempts = Math.round((0.95 - strat.minQuality) / strat.step) + 1;
                
                while (quality >= strat.minQuality && attempts < maxAttempts) {
                    attempts++;
                    const attemptProgress = baseProgress + (attempts / maxAttempts) * 18;
                    updateProgress(attemptProgress, `Quality ${(quality*100).toFixed(0)}% (attempt ${attempts}/${maxAttempts})`);
                    
                    await new Promise(resolve => setTimeout(resolve, 20));
                    
                    try {
                        const pdf = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
                        let pageCount = 1;
                        let yPos = 10;
                        
                        for (let i = 0; i < images.length; i++) {
                            const img = images[i];
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            canvas.width = img.naturalWidth * strat.scale;
                            canvas.height = img.naturalHeight * strat.scale;
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            
                            const dataUrl = canvas.toDataURL('image/jpeg', quality);
                            const imgProps = pdf.getImageProperties(dataUrl);
                            const pdfWidth = 190;
                            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                            
                            if (i > 0 && yPos + pdfHeight > 277) {
                                pdf.addPage();
                                pageCount++;
                                yPos = 10;
                            }
                            
                            pdf.addImage(dataUrl, 'JPEG', 10, yPos, pdfWidth, pdfHeight, undefined, 'FAST');
                            yPos += pdfHeight + 5;
                        }
                        
                        pdfBlob = pdf.output('blob');
                        
                        if (pdfBlob.size <= maxBytes) {
                            finalStrategy = `${strat.name} (${pageCount} pages)`;
                            updateProgress(98, 'Success! Generating final PDF...');
                            await new Promise(resolve => setTimeout(resolve, 200));
                            break strategyLoop;
                        }
                    } catch (e) {
                        console.error('PDF generation error:', e);
                        break;
                    }
                    
                    quality -= strat.step;
                }
            }
            
            updateProgress(100, 'Complete! 🎉');
            await new Promise(resolve => setTimeout(resolve, 300));
            
            const finalSizeKB = (pdfBlob?.size / 1024).toFixed(0);
            const targetKB = (maxBytes / 1024).toFixed(0);
            
            if (pdfBlob && pdfBlob.size <= maxBytes) {
                showStatus('success', `✅ Success with ${finalStrategy}! PDF: ${finalSizeKB} KB (target ≤${targetKB} KB)`);
            } else {
                showStatus('warn', `⚠️ Could not meet ${targetKB}KB limit. Best: ${finalSizeKB} KB`);
            }
            
            if (pdfBlob) {
                const baseName = sanitizeFilename(outputNameInput.value || 'output');
                const timestamp = getTimestamp();
                const filename = `${baseName}_${timestamp}.pdf`;
                
                downloadLink.href = URL.createObjectURL(pdfBlob);
                downloadLink.download = filename;
                downloadLink.textContent = `📥 Download ${filename}`;
                downloadLink.style.display = 'inline-block';
            }
            
            generateBtn.disabled = false;
        });
        
        async function fileToImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error(`Failed to load ${file.name}`));
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        
        function showStatus(type, message) {
            status.className = `status ${type}`;
            status.textContent = message;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
