<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPEG to PDF Size-Optimized Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
        .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; }
        .file-input-wrapper input[type=file] { position: absolute; left: -9999px; }
        .file-input-label { display: block; padding: 1rem 2rem; border: 2px dashed #ccc; border-radius: 8px; background: #f9f9f9; cursor: pointer; text-align: center; transition: all 0.2s; }
        .file-input-label:hover { border-color: #007bff; background: #f0f8ff; }
        .controls { margin: 1rem 0; }
        input[type="number"] { width: 120px; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-left: 1rem; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { margin: 1rem 0; padding: 1rem; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .warn { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .progress { width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 1rem 0; }
        .progress-bar { height: 100%; background: #007bff; width: 0%; transition: width 0.3s; }
        #fileList { margin-top: 1rem; }
        .file-item { padding: 0.5rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .download-link { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem; background: #28a745; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>JPEG to PDF Size-Optimized</h1>
    <p>Upload JPEG images and set max PDF size. It automatically optimizes to meet your limit (goes aggressive if needed).</p>
    
    <div class="file-input-wrapper">
        <input type="file" id="imageInput" multiple accept="image/jpeg,image/jpg">
        <label for="imageInput" class="file-input-label">📁 Select JPEG images</label>
    </div>
    
    <div id="fileList"></div>
    
    <div class="controls">
        <label>Max PDF size:</label>
        <input type="number" id="maxSize" min="1" max="51200" step="100" value="5120"> KB
        <button id="generateBtn" disabled>Generate PDF</button>
    </div>
    
    <div id="status" class="status info" style="display: none;"></div>
    <div id="progress" class="progress" style="display: none;">
        <div id="progressBar" class="progress-bar"></div>
    </div>
    <a id="downloadLink" class="download-link" style="display: none;">📥 Download PDF</a>

    <script>
        const { jsPDF } = window.jspdf;
        const imageInput = document.getElementById('imageInput');
        const fileList = document.getElementById('fileList');
        const maxSizeInput = document.getElementById('maxSize');
        const generateBtn = document.getElementById('generateBtn');
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const downloadLink = document.getElementById('downloadLink');
        
        let selectedImages = [];
        
        imageInput.addEventListener('change', (e) => {
            selectedImages = Array.from(e.target.files).filter(f => f.type.startsWith('image/jpeg'));
            updateFileList();
            generateBtn.disabled = selectedImages.length === 0;
        });
        
        function updateFileList() {
            fileList.innerHTML = selectedImages.map(f => `<div class="file-item">${f.name} (${(f.size/1024).toFixed(0)} KB)</div>`).join('') || '<div>No JPEGs selected</div>';
        }
        
        generateBtn.addEventListener('click', async () => {
            const maxBytes = parseInt(maxSizeInput.value) * 1024;
            if (maxBytes < 1024) {
                showStatus('warn', 'Max size too small (minimum 1KB)');
                return;
            }
            
            showStatus('info', 'Optimizing aggressively...');
            progress.style.display = 'block';
            generateBtn.disabled = true;
            
            // Load images
            const images = await Promise.all(selectedImages.map(fileToImage));
            
            // Try multiple strategies in order of aggressiveness
            const strategies = [
                { name: 'High Quality', scale: 1.0, minQuality: 0.7, step: 0.05 },
                { name: 'Medium', scale: 0.8, minQuality: 0.5, step: 0.05 },
                { name: 'Aggressive', scale: 0.6, minQuality: 0.3, step: 0.03 },
                { name: 'Extreme', scale: 0.4, minQuality: 0.2, step: 0.02 }
            ];
            
            let pdfBlob = null;
            let finalStrategy = '';
            
            for (let strat of strategies) {
                showStatus('info', `Trying ${strat.name} (${Math.round(strat.scale*100)}% scale, quality down to ${Math.round(strat.minQuality*100)}%)...`);
                
                let quality = 0.95;
                while (quality >= strat.minQuality) {
                    updateProgress((quality - strat.minQuality) / (0.95 - strat.minQuality) * 50 + (strategies.indexOf(strat) * 12.5));
                    
                    try {
                        const pdf = new jsPDF({ 
                            unit: 'mm', 
                            format: 'a4', 
                            compress: true
                        });
                        let yPos = 10;
                        
                        for (let img of images) {
                            // Pre-scale canvas for aggressive downsampling
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            const imgProps = { width: img.naturalWidth, height: img.naturalHeight };
                            canvas.width = imgProps.width * strat.scale;
                            canvas.height = imgProps.height * strat.scale;
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            
                            const dataUrl = canvas.toDataURL('image/jpeg', quality);
                            const pdfImgProps = pdf.getImageProperties(dataUrl);
                            const pdfWidth = 190;
                            const pdfHeight = (pdfImgProps.height * pdfWidth) / pdfImgProps.width;
                            
                            if (yPos + pdfHeight > 277) {
                                pdf.addPage();
                                yPos = 10;
                            }
                            
                            pdf.addImage(dataUrl, 'JPEG', 10, yPos, pdfWidth, pdfHeight, undefined, 'FAST');
                            yPos += pdfHeight + 5;
                        }
                        
                        pdfBlob = pdf.output('blob');
                        
                        if (pdfBlob.size <= maxBytes) {
                            finalStrategy = strat.name;
                            break;
                        }
                    } catch (e) {
                        console.error(e);
                        break;
                    }
                    
                    quality -= strat.step;
                }
                
                if (pdfBlob && pdfBlob.size <= maxBytes) break;
            }
            
            updateProgress(100);
            
            const finalSizeKB = (pdfBlob?.size / 1024).toFixed(0);
            const targetKB = (maxBytes / 1024).toFixed(0);
            
            if (pdfBlob && pdfBlob.size <= maxBytes) {
                showStatus('success', `✅ Success with ${finalStrategy}! PDF: ${finalSizeKB} KB (target ≤${targetKB} KB)`);
            } else {
                showStatus('warn', `⚠️ Could not meet ${targetKB}KB limit even with Extreme settings. Best: ${finalSizeKB} KB`);
            }
            
            if (pdfBlob) {
                downloadLink.href = URL.createObjectURL(pdfBlob);
                downloadLink.download = `optimized-${finalStrategy}-${Date.now()}.pdf`;
                downloadLink.style.display = 'inline-block';
            }
            
            progress.style.display = 'none';
            generateBtn.disabled = false;
        });
        
        async function fileToImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        
        function showStatus(type, message) {
            status.className = `status ${type}`;
            status.textContent = message;
            status.style.display = 'block';
        }
        
        function updateProgress(percent) {
            progressBar.style.width = Math.min(100, percent) + '%';
        }
    </script>
</body>
</html>
